
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Subscription</title>

    <style>
        body {
            font-family: Arial;
            background: aliceblue;
            padding: 30px;
            text-align: center;
        }

        main {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .topic {
            background: lightblue;
            padding: 12px;
            margin: 10px;
            list-style: none;
            cursor: pointer;
        }

        button {
            padding: 10px;
            margin: 5px;
            cursor: pointer;
        }

        #message {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <h1>Event Subscription Panel</h1>
</header>

<main>

    <h2>Choose Your Topics</h2>

    <ul id="topics">
        <li class="topic">Technology</li>
        <li class="topic">Education</li>
        <li class="topic">Sports</li>
        <li class="topic">Business</li>
        <li class="topic">Entertainment</li>
    </ul>

    <input type="text" id="newTopic"
           placeholder="Enter new topic">

    <button id="addTopic">Add Topic</button>

    <br>

    <button id="subscribe">Subscribe</button>
    <button id="unsubscribe">Unsubscribe</button>
    <button id="remove">Remove Selected Topic</button>

    <p id="message" aria-live="polite"></p>

</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="script.js"></script>
</body>
</html>

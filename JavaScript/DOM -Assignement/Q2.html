<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q2 - Character Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Live Character Counter</h1>

    <textarea id="message" maxlength="100"
              rows="6" placeholder="Write something..."></textarea>

    <p id="counter">100 characters remaining</p>

    <button id="resetButton">Reset</button>
</div>
<script src="Q2.js"></script>
</body>
</html>

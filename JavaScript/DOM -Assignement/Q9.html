<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q9 - Form Validation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Form Submit Blocker</h1>

    <form id="registrationForm" novalidate>

        <label>Name:</label><br>
        <input type="text" id="fullName" placeholder="Enter name">
        <p class="error" id="fullNameError"></p>

        <label>Email:</label><br>
        <input type="text" id="userEmail" placeholder="Enter email">
        <p class="error" id="userEmailError"></p>

        <label>Password:</label><br>
        <input type="password" id="userPassword"
               placeholder="Minimum 6 characters">
        <p class="error" id="userPasswordError"></p>

        <button type="submit">Submit</button>
    </form>

    <p id="successMessage" class="success"></p>
</div>
<script src="Q9.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q6 - Student Table Filter</title>
    <link rel="stylesheet" href="style.css">
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid gray;
            padding: 10px;
            text-align: left;
        }

        th {
            background: lightgray;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Student Table Filter</h1>

    <input type="text" id="searchInput" placeholder="Search students...">

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Branch</th>
                <th>CGPA</th>
            </tr>
        </thead>
        <tbody id="studentRows">
            <tr><td>Aman</td><td>CSE</td><td>8.2</td></tr>
            <tr><td>Priya</td><td>ECE</td><td>8.7</td></tr>
            <tr><td>Rahul</td><td>AI & DS</td><td>7.9</td></tr>
            <tr><td>Neha</td><td>CSE</td><td>9.1</td></tr>
            <tr><td>Arjun</td><td>ME</td><td>7.5</td></tr>
        </tbody>
    </table>

    <p id="noResults" class="error hidden">No results found</p>
</div>
<script src="Q6.js"></script>
</body>
</html>

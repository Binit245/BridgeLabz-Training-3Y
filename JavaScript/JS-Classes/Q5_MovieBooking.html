
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Ticket Booking</title>
</head>
<body>
    <h2>Book Movie Tickets</h2>

    <form id="bookingForm">
        <input id="name" placeholder="Name" required>
        <input id="email" type="email" placeholder="Email" required>
        <input id="seats" type="number" min="1" max="10"
            placeholder="Seats (1-10)" required>
        <button type="submit">Book Ticket</button>
    </form>

    <p id="message"></p>
    <div id="ticket"></div>

    <script src="Q5_MovieBooking.js"></script>
</body>
</html>
